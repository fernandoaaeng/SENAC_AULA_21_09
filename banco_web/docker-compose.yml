services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexusbank
    ports:
      - "5432:5432"
    volumes:
      - nexus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusbank"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexusbank
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  nexus_pg:
